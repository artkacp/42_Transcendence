# Loads every JSON dashboard in monitoring/grafana/dashboards (mounted at
# /etc/grafana/dashboards). The files are the source of truth: UI edits can't
# be saved over them and the dashboards can't be deleted from the UI.
apiVersion: 1

providers:
  - name: pawfect
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
