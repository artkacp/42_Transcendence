# No Alertmanager: alerts only show as pending/firing in Prometheus itself.
groups:
  - name: backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Backend /metrics unreachable for more than 1 minute

      # /metrics scrapes (4/min) count as 200s, so an idle backend needs 2+ errors in 5m to fire.
      - alert: BackendHigh5xxRatio
        expr: |
          sum by (job, instance) (rate(django_http_responses_total_by_status_total{job="backend", status=~"5.."}[5m]))
            /
          sum by (job, instance) (rate(django_http_responses_total_by_status_total{job="backend"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend 5xx responses above 5% for more than 5 minutes
          description: "{{ $value | humanizePercentage }} of backend responses over the last 5 minutes were 5xx."

  - name: host
    rules:
      # 10m so the CPU spike from `docker compose up --build` doesn't fire it.
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU above 90% for more than 10 minutes
          description: "Host CPU use averaged {{ $value | humanize }}% across all cores over the last 5 minutes."
