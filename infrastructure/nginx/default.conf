# Single entry point (010 #12): built frontend on /, the one Daphne process on
# /api/ and /ws/. HTTP only for now — HTTPS comes in a later D2 step.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # SPA fallback: unknown paths get index.html so client-side routing works.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade; the long read timeout keeps idle sockets open past
    # nginx's 60s default.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
