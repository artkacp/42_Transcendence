# Single entry point (010 #12): built frontend on /, the one Daphne process on
# /api/ and /ws/. TLS terminates here; certificates come from the certgen service.
server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 5 MB; the extra 1m covers multipart overhead.
    client_max_body_size 6m;

    # SPA fallback: unknown paths get index.html so client-side routing works.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade; the long read timeout keeps idle sockets open past
    # nginx's 60s default.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    # Public uploads straight from the media volume. Allowlist: only avatars/
    # and pets/ are served; anything else under /media/ (attachments/ included)
    # is 404 — attachments are reachable only through the permission-checked
    # Django download view. ^~ keeps any future regex location from overriding.
    location ^~ /media/avatars/ {
        alias /srv/media/avatars/;
    }

    location ^~ /media/pets/ {
        alias /srv/media/pets/;
    }

    location ^~ /media/ {
        return 404;
    }
}
