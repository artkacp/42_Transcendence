services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    # Runs the Dockerfile's single-process Daphne CMD. For hot-reload dev,
    # layer docker-compose.dev.yml on top (see backend/README.md).
    # No published port: only reachable through nginx.
    env_file:
      - .env
    # Uploads persist here; MEDIA_ROOT resolves to /app/media.
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Runs once: creates the local CA and nginx's server certificate in
  # infrastructure/certs/out (gitignored), skipping if they already exist.
  certgen:
    build: ./infrastructure/certs
    volumes:
      - ./infrastructure/certs/out:/out

  nginx:
    build: ./frontend
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Only the server cert and key — the CA key is never mounted here.
      - ./infrastructure/certs/out/server:/etc/nginx/ssl:ro
      # Read-only; default.conf serves only avatars/ and pets/ from it.
      - media:/srv/media:ro
    ports:
      - "8443:443"
    depends_on:
      backend:
        condition: service_started
      certgen:
        condition: service_completed_successfully

  # Scrapes backend /metrics and node-exporter (config in monitoring/prometheus).
  # No published port: internal network only.
  prometheus:
    image: prom/prometheus:v3.15.0
    # Overriding command drops the image's default flags, so the storage path
    # is repeated here to keep data in the volume.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # Host metrics without root: host /proc, /sys and / mounted read-only, no
  # privileged mode and no host network. Network counters are therefore the
  # container's own, not the host's.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    restart: unless-stopped

volumes:
  postgres_data:
  media:
  prometheus_data:
